<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset=".5" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d9a8"/>
      <stop offset=".35" stop-color="#d4a968"/>
      <stop offset=".6" stop-color="#b78846"/>
      <stop offset="1" stop-color="#8a5f2b"/>
    </linearGradient>
    <linearGradient id="ribbonGoldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a968"/>
      <stop offset="1" stop-color="#8a5f2b"/>
    </linearGradient>
    <radialGradient id="bowLoop" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#f4d9a8"/>
      <stop offset=".5" stop-color="#d4a968"/>
      <stop offset="1" stop-color="#8a5f2b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="108" rx="40" ry="4" fill="#000" opacity=".25"/>

  <!-- Box bottom (darker base) -->
  <!-- Front face -->
  <path d="M 18 62 L 60 80 L 60 104 L 18 86 Z" fill="url(#boxFront)"/>
  <!-- Right face -->
  <path d="M 60 80 L 102 62 L 102 86 L 60 104 Z" fill="url(#boxSide)"/>
  <!-- Gold trim between box and lid -->
  <path d="M 18 62 L 60 80 L 102 62 L 60 44 Z" fill="#c9a063" opacity=".4"/>

  <!-- Box lid (larger, on top) -->
  <!-- Top face -->
  <path d="M 15 52 L 60 70 L 105 52 L 60 34 Z" fill="url(#boxTop)"/>
  <!-- Lid front face -->
  <path d="M 15 52 L 60 70 L 60 78 L 15 60 Z" fill="url(#boxFront)"/>
  <!-- Lid right face -->
  <path d="M 60 70 L 105 52 L 105 60 L 60 78 Z" fill="url(#boxSide)"/>

  <!-- Vertical ribbon on top -->
  <path d="M 52 38 L 68 44 L 68 66 L 52 58.5 Z" fill="url(#ribbonGold)"/>
  <!-- Vertical ribbon down front -->
  <path d="M 52 58.5 L 68 66 L 68 88 L 52 80.5 Z" fill="url(#ribbonGoldSide)" opacity=".9"/>

  <!-- Horizontal ribbon on top -->
  <path d="M 30 46 L 75 64 L 90 58 L 45 40 Z" fill="url(#ribbonGold)"/>
  <!-- Horizontal ribbon on right side -->
  <path d="M 75 64 L 90 58 L 90 76 L 75 82 Z" fill="url(#ribbonGoldSide)" opacity=".85"/>
  <!-- Horizontal ribbon on left side -->
  <path d="M 30 46 L 30 64 L 45 58 L 45 40 Z" fill="url(#ribbonGoldSide)" opacity=".7"/>

  <!-- Bow on top -->
  <!-- Left loop -->
  <path d="M 55 32 C 38 22, 32 36, 48 42 C 54 44, 58 42, 60 40 Z" fill="url(#bowLoop)"/>
  <!-- Right loop -->
  <path d="M 65 32 C 82 22, 88 36, 72 42 C 66 44, 62 42, 60 40 Z" fill="url(#bowLoop)"/>
  <!-- Bow tails -->
  <path d="M 54 42 L 50 54 L 58 46 Z" fill="url(#ribbonGold)"/>
  <path d="M 66 42 L 70 54 L 62 46 Z" fill="url(#ribbonGold)"/>
  <!-- Bow center knot -->
  <ellipse cx="60" cy="39" rx="5" ry="4.5" fill="#8a5f2b"/>
  <ellipse cx="60" cy="38" rx="3.5" ry="3" fill="url(#ribbonGold)" opacity=".6"/>

  <!-- Highlight on top of lid -->
  <path d="M 35 46 L 60 56 L 60 58 L 35 48 Z" fill="#fff" opacity=".06"/>
</svg>
