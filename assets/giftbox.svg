<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Black surfaces with subtle satin sheen -->
    <linearGradient id="topFace" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#2d2d2d"/>
      <stop offset=".45" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="frontFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset=".5" stop-color="#151515"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>

    <!-- Gold satin gradients (3 variants for different surfaces) -->
    <linearGradient id="goldTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e0b5"/>
      <stop offset=".25" stop-color="#e5c38a"/>
      <stop offset=".55" stop-color="#c89a5e"/>
      <stop offset=".85" stop-color="#a67a3f"/>
      <stop offset="1" stop-color="#7d5827"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ab72"/>
      <stop offset=".5" stop-color="#b0834a"/>
      <stop offset="1" stop-color="#7d5827"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a063"/>
      <stop offset="1" stop-color="#8a5f2b"/>
    </linearGradient>
    <radialGradient id="bowLoop" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fde5b8"/>
      <stop offset=".3" stop-color="#e5c38a"/>
      <stop offset=".7" stop-color="#b0834a"/>
      <stop offset="1" stop-color="#6d4a20"/>
    </radialGradient>
    <radialGradient id="bowKnot" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#b0834a"/>
      <stop offset="1" stop-color="#4a3015"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="180" rx="70" ry="6" fill="#000" opacity=".28"/>
  <ellipse cx="100" cy="180" rx="50" ry="4" fill="#000" opacity=".4"/>

  <!-- ============ BOX BASE (bottom part) ============ -->
  <!-- Front face of base -->
  <path d="M 32 108 L 100 138 L 100 172 L 32 142 Z" fill="url(#frontFace)"/>
  <!-- Right face of base -->
  <path d="M 100 138 L 168 108 L 168 142 L 100 172 Z" fill="url(#sideFace)"/>

  <!-- Gold trim line between base and lid -->
  <path d="M 30 106 L 100 136 L 170 106 L 100 76 Z" fill="url(#goldTop)" opacity=".9"/>
  <path d="M 30 106 L 100 136 L 100 140 L 30 110 Z" fill="url(#goldFront)"/>
  <path d="M 100 136 L 170 106 L 170 110 L 100 140 Z" fill="url(#goldSide)"/>

  <!-- ============ BOX LID (top part) ============ -->
  <!-- Lid top face -->
  <path d="M 28 92 L 100 120 L 172 92 L 100 64 Z" fill="url(#topFace)"/>
  <!-- Lid front face -->
  <path d="M 28 92 L 100 120 L 100 132 L 28 104 Z" fill="url(#frontFace)"/>
  <!-- Lid right face -->
  <path d="M 100 120 L 172 92 L 172 104 L 100 132 Z" fill="url(#sideFace)"/>

  <!-- Subtle highlight on lid top -->
  <path d="M 50 88 L 100 108 L 100 112 L 50 92 Z" fill="#fff" opacity=".04"/>

  <!-- ============ GOLD RIBBONS ============ -->
  <!-- Vertical ribbon on top of lid (from back-left to front-right) -->
  <path d="M 88 64 L 112 74 L 112 128 L 88 118 Z" fill="url(#goldTop)"/>
  <!-- Vertical ribbon continues down front of lid -->
  <path d="M 88 118 L 112 128 L 112 142 L 88 132 Z" fill="url(#goldFront)"/>
  <!-- Vertical ribbon continues down front of base -->
  <path d="M 88 142 L 112 152 L 112 178 L 88 168 Z" fill="url(#goldFront)" opacity=".9"/>

  <!-- Horizontal ribbon on top (crossing) -->
  <path d="M 45 88 L 115 116 L 155 100 L 85 72 Z" fill="url(#goldTop)"/>
  <!-- Horizontal ribbon down right side of lid -->
  <path d="M 115 116 L 155 100 L 155 112 L 115 128 Z" fill="url(#goldSide)"/>
  <!-- Horizontal ribbon down right side of base -->
  <path d="M 115 142 L 155 126 L 155 150 L 115 166 Z" fill="url(#goldSide)" opacity=".85"/>
  <!-- Horizontal ribbon down left side of lid -->
  <path d="M 45 88 L 45 100 L 85 84 L 85 72 Z" fill="url(#goldFront)" opacity=".75"/>

  <!-- ============ BOW ON TOP ============ -->
  <!-- Back shadow of bow -->
  <ellipse cx="100" cy="66" rx="42" ry="14" fill="#000" opacity=".15"/>

  <!-- Bow tail left (longer, hanging below bow) -->
  <path d="M 92 68 L 76 92 L 82 90 L 96 72 Z" fill="url(#goldFront)"/>
  <path d="M 76 92 L 82 90 L 80 96 L 74 96 Z" fill="url(#goldSide)"/>
  <!-- Bow tail right -->
  <path d="M 108 68 L 124 92 L 118 90 L 104 72 Z" fill="url(#goldFront)"/>
  <path d="M 124 92 L 118 90 L 120 96 L 126 96 Z" fill="url(#goldSide)"/>

  <!-- Bow left loop -->
  <path d="M 94 56 C 70 40, 58 62, 76 72 C 84 76, 92 70, 98 64 Z" fill="url(#bowLoop)"/>
  <!-- Loop shadow/fold -->
  <path d="M 78 68 C 74 66, 72 58, 78 52 C 80 58, 82 62, 86 64 Z" fill="#8a5f2b" opacity=".4"/>

  <!-- Bow right loop -->
  <path d="M 106 56 C 130 40, 142 62, 124 72 C 116 76, 108 70, 102 64 Z" fill="url(#bowLoop)"/>
  <!-- Loop shadow/fold -->
  <path d="M 122 68 C 126 66, 128 58, 122 52 C 120 58, 118 62, 114 64 Z" fill="#8a5f2b" opacity=".4"/>

  <!-- Bow center knot -->
  <ellipse cx="100" cy="62" rx="8" ry="9" fill="url(#bowKnot)"/>
  <ellipse cx="100" cy="60" rx="5.5" ry="6" fill="url(#goldTop)" opacity=".7"/>
  <!-- Knot highlight -->
  <ellipse cx="98" cy="58" rx="2" ry="1.5" fill="#fde5b8" opacity=".6"/>

  <!-- Tiny sparkle on bow -->
  <circle cx="86" cy="52" r="1" fill="#fff" opacity=".7"/>
  <circle cx="114" cy="54" r=".8" fill="#fff" opacity=".6"/>
</svg>
