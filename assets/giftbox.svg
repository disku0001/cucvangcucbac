<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c38a"/>
      <stop offset=".5" stop-color="#c9a063"/>
      <stop offset="1" stop-color="#a8824a"/>
    </linearGradient>
  </defs>
  <!-- Box body -->
  <rect x="5" y="14" width="22" height="15" rx="1.5" fill="url(#g1)"/>
  <!-- Lid -->
  <rect x="4" y="10" width="24" height="6" rx="1.5" fill="url(#g1)"/>
  <!-- Gold trim line between lid and box -->
  <rect x="4" y="15.5" width="24" height="1" fill="#c9a063" opacity=".85"/>
  <!-- Vertical ribbon -->
  <rect x="14" y="10" width="4" height="19" fill="url(#g2)"/>
  <!-- Horizontal ribbon on lid -->
  <rect x="4" y="12" width="24" height="2.5" fill="url(#g2)"/>
  <!-- Bow left loop -->
  <path d="M13 10 C 8 7, 7 11, 11 12 L 15 11 Z" fill="url(#g2)"/>
  <!-- Bow right loop -->
  <path d="M19 10 C 24 7, 25 11, 21 12 L 17 11 Z" fill="url(#g2)"/>
  <!-- Bow center knot -->
  <rect x="14" y="9.5" width="4" height="3" rx=".8" fill="#a8824a"/>
  <!-- Bow tails -->
  <path d="M14 12 L 12 15 L 14 14 Z" fill="url(#g2)"/>
  <path d="M18 12 L 20 15 L 18 14 Z" fill="url(#g2)"/>
</svg>
